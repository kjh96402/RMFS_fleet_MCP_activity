# Render Blueprint — GitHub 저장소를 연결하면 이 설정으로 자동 배포
# (Render 대시보드 → New → Blueprint → 저장소 선택)
services:
  - type: web
    name: rmfs-fleet-mcp
    runtime: python
    plan: free                      # 무료: 15분 유휴 시 슬립, 첫 호출 지연 약 1분
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py  # PORT 환경변수는 Render가 자동 주입 (원격 배포는 선택 사항 · 기본 실습은 로컬 stdio)
    healthCheckPath: /mcp
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MODEL_DIR
        value: model
